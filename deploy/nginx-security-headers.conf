# Security headers for the static landing. Installed to
# /etc/nginx/snippets/myfinance-security-headers.conf by deploy.sh and included
# in EVERY landing location that sets its own add_header: nginx drops all
# server-level add_header lines in such a location, so without this the pages
# people actually read shipped with no HSTS, CSP or frame protection.
#
# CSP: the landing loads GA4 (gtag.js) and nothing else external, and only
# after the visitor clicks Allow: /consent.js injects it then. The GA
# bootstrap and the consent banner live in /consent.js, so no page carries an
# inline executable script and script-src needs no hash or 'unsafe-inline'.
# JSON-LD blocks are data, not script, and CSP does not apply to them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
